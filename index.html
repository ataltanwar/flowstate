<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="flowstate">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="color-scheme" content="light">
  <meta name="description" content="A simple, local-first task manager: see today, plan the next few days, and write things down.">
  <title>Your daily tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="primary-nav" aria-label="Primary">
    <div class="brand">
      <span aria-hidden="true">
        <img src="./logo.png" alt="flowstate logo" width="100px">
      </span>
    </div>

    <div class="nav-items">
      <button class="nav-btn" type="button" data-nav="today">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
        </svg>
        <span>Today</span>
      </button>
      <button class="nav-btn" type="button" data-nav="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M8 3v4M16 3v4M3 10h18"/>
        </svg>
        <span>Calendar</span>
      </button>
      <button class="nav-btn" type="button" data-nav="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6h11M9 12h11M9 18h11"/>
          <path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>
        </svg>
        <span>Tasks</span>
      </button>
    </div>

    <p class="side-foot">Local-first. Your data stays on this device.</p>
  </nav>

  <div class="content">
    <main>
      <!-- TODAY -->
      <section class="view" id="view-today" aria-labelledby="today-heading">
        <header class="page-head">
          <p class="eyebrow">Hello, Atal!</p>
          <h1 id="today-heading">Today</h1>
          <p class="subline">
            <span id="today-date"></span>
            <span class="dot-sep" aria-hidden="true">&middot;</span>
            <span id="today-time"></span>
          </p>
        </header>

        <div class="today-grid">
          <div class="day-cards" id="day-cards"></div>

          <aside class="open-tasks-panel" aria-labelledby="open-tasks-title">
            <div class="open-tasks-head">
              <div>
                <p class="eyebrow">Your workload</p>
                <h2 id="open-tasks-title">Open tasks</h2>
              </div>
              <span class="open-tasks-count" id="open-tasks-count"></span>
            </div>
            <div id="open-tasks-list"></div>
          </aside>
        </div>

        <button class="continue-link" type="button" data-action="continue-calendar">
          <span>Continue to Calendar</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
      </section>

      <!-- CALENDAR -->
      <section class="view" id="view-calendar" aria-labelledby="calendar-page-title" hidden>
        <header class="page-head">
          <p class="eyebrow">Plan ahead</p>
          <h1 id="calendar-page-title">Calendar</h1>
        </header>

        <div class="calendar-card">
          <div class="calendar-head">
            <button class="icon-btn" type="button" data-action="calendar-prev" aria-label="Previous month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
            </button>
            <h2 class="calendar-title" id="calendar-title"></h2>
            <button class="icon-btn" type="button" data-action="calendar-next" aria-label="Next month">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
            </button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
        </div>

        <section class="selected-day" aria-labelledby="selected-day-title">
          <div class="selected-day-head">
            <div>
              <h2 id="selected-day-title"></h2>
              <p class="selected-day-meta" id="selected-day-count"></p>
            </div>
            <button class="add-inline" type="button" data-action="add-task-selected">+ Add task</button>
          </div>
          <div id="calendar-task-list"></div>
        </section>
      </section>

      <!-- TASKS -->
      <section class="view" id="view-tasks" aria-labelledby="tasks-page-title" hidden>
        <header class="page-head">
          <p class="eyebrow">Everything</p>
          <h1 id="tasks-page-title">Tasks</h1>
          <p class="subline" id="tasks-sub"></p>
        </header>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-btn" type="button" data-filter="inbox" aria-pressed="false">Inbox</button>
          <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <div class="tasks-card" id="tasks-list"></div>
      </section>
    </main>
  </div>

  <button class="fab" type="button" data-action="add-task" aria-label="Add task">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- TASK DIALOG -->
  <dialog class="dialog" id="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" novalidate>
      <header class="dialog-head">
        <h2 id="dialog-title">New task</h2>
        <button class="close-btn" type="button" data-action="close-dialog" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="field">
        <label for="task-title">Task title</label>
        <input id="task-title" type="text" maxlength="200" autocomplete="off"
               placeholder="What needs to be done?" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="task-date" id="task-date-label">Date</label>
          <input id="task-date" type="date">
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="urgent">Urgent</option>
            <option value="important">Important</option>
            <option value="normal" selected>Normal</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <label class="inbox-toggle">
        <input type="checkbox" id="task-inbox">
        <span>Save to Inbox &mdash; no date yet</span>
      </label>

      <details class="more-options" id="more-options">
        <summary>More options</summary>
        <div class="field">
          <label for="task-notes">Notes</label>
          <textarea id="task-notes" rows="3" maxlength="2000" placeholder="Optional details"></textarea>
        </div>
      </details>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <footer class="dialog-actions">
        <button class="btn btn-danger" type="button" id="delete-task" data-action="delete-task" hidden>Delete</button>
        <button class="btn btn-ghost" type="button" data-action="close-dialog">Cancel</button>
        <button class="btn btn-primary" type="submit" id="save-task">Create task</button>
      </footer>
    </form>
  </dialog>

  <!-- DAY VIEW DIALOG -->
  <dialog class="dialog" id="day-dialog" aria-labelledby="day-dialog-title">
    <div class="dialog-body">
      <header class="dialog-head">
        <div>
          <h2 id="day-dialog-title"></h2>
          <p class="dialog-sub" id="day-dialog-sub"></p>
        </div>
        <button class="close-btn" type="button" data-action="close-dialog" aria-label="Close day view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="day-dialog-list"></div>
      <button class="btn btn-primary day-add" type="button" id="day-dialog-add" data-action="add-task-for-day">+ Add task</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>This application needs JavaScript enabled to work.</noscript>

  <script src="script.js" defer></script>
  <script src="pwa.js" defer></script>
</body>
</html>
